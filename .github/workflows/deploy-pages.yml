name: Deploy to GitHub Pages

# Publishing only. THE GATE IS NOT HERE.
#
# GitHub Actions no longer verifies anything: `npm run ci` runs the full gate on the
# machine doing the work and reports the `Verify` status itself. This workflow used to
# carry a `verify` job duplicating the CI one -- and for several commits the two were NOT
# identical while their comments claimed they were. That whole class of drift is gone with
# the duplicate, which is the one unambiguous good thing about moving the runner.
#
# **What this workflow no longer guarantees:** a commit can reach production without the
# gate having passed, if whoever merged reported a status they had not earned.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build static site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The page loads ./dist/main.js, so the site cannot be assembled
            # from the sources any more — it must be built. The gate runs
            # `npm run build` too, but on a different machine, so it is built here.
            - name: Build the browser artifact
              run: npm run build

            - name: Assemble static site
              run: |
                  rm -rf _site
                  mkdir -p _site
                  cp index.html styles.css game.js _site/
                  # iter-12 fix: ship the service worker and PWA manifest. Without
                  # these the live page logged a 404 + console.error every load
                  # because index.html registers `./service-worker.js` on boot.
                  [ -f service-worker.js ] && cp service-worker.js _site/ || true
                  [ -f manifest.json ] && cp manifest.json _site/ || true
                  # Built output, not sources: index.html imports ./dist/main.js.
                  cp -r dist _site/dist
                  if [ -d docs ]; then cp -r docs _site/docs; fi
                  # Simple 404 fallback so deep-links to hash routes still load the game.
                  cp index.html _site/404.html
                  # Disable Jekyll processing on Pages.
                  touch _site/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
