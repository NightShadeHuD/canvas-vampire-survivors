name: Deploy to GitHub Pages

# Nothing reaches production unless the full engineering gate passes.
# Previously this workflow had no verify job at all: `deploy` depended only on
# a job that copied files into _site, so a commit with failing tests, lint
# errors or accessibility regressions would have deployed without complaint.
# See docs/ENGINEERING-STANDARDS.md §2.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # Gate. Kept identical to the CI job -- and it was NOT, for several commits, while
    # this comment said it was: `fetch-depth: 0` and the Godot steps were missing. A
    # comment asserting parity is not parity, and nothing checked it.
    #
    # `check:dep-drift` does now: both workflows must install the same toolchain steps.
    # Gate. Identical to the CI job so the two can never drift.
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # `check:assertions` compares the branch against its base, so it needs
                  # the history a shallow clone omits. THIS WAS MISSING while the comment
                  # above claimed the two jobs were identical -- found by a tooling audit,
                  # which noted that the commit which achieved parity is the one that
                  # removed it. Without it the revision half is structurally vacuous.
                  fetch-depth: 0

            # Node 24: required for native TypeScript type stripping, which the
            # migration relies on to run test/*.ts directly with no build step.
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium for the browser gates
              run: npx playwright install --with-deps chromium

            # Godot, as in ci.yml. Without these two steps check:godot prints NOTICE and
            # exits 0, so the 12 suites, 309 assertions and the drift check run NOWHERE on
            # the required check.
            - name: Install Godot
              run: |
                  set -euo pipefail
                  GODOT_VERSION=4.7.2
                  curl -fsSL -o /tmp/godot.zip \
                    "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
                  unzip -q /tmp/godot.zip -d /tmp/godot
                  sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
                  sudo chmod +x /usr/local/bin/godot
                  godot --version

            - name: Import the Godot project
              run: godot --headless --path godot --import

            - name: Run the full verify gate
              run: npm run verify:all

    build:
        name: Build static site
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The page loads ./dist/main.js, so the site cannot be assembled
            # from the sources any more — it must be built. The `verify` job
            # above already ran `npm run build` as part of the gate, but each
            # job gets a fresh checkout, so it is built here too.
            - name: Build the browser artifact
              run: npm run build

            - name: Assemble static site
              run: |
                  rm -rf _site
                  mkdir -p _site
                  cp index.html styles.css game.js _site/
                  # iter-12 fix: ship the service worker and PWA manifest. Without
                  # these the live page logged a 404 + console.error every load
                  # because index.html registers `./service-worker.js` on boot.
                  [ -f service-worker.js ] && cp service-worker.js _site/ || true
                  [ -f manifest.json ] && cp manifest.json _site/ || true
                  # Built output, not sources: index.html imports ./dist/main.js.
                  cp -r dist _site/dist
                  if [ -d docs ]; then cp -r docs _site/docs; fi
                  # Simple 404 fallback so deep-links to hash routes still load the game.
                  cp index.html _site/404.html
                  # Disable Jekyll processing on Pages.
                  touch _site/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
