name: CI

# The authoritative gate. Hooks are fast feedback and can be bypassed with
# --no-verify; this cannot. Branch protection on `main` requires the `Verify`
# job to pass before merge.
#
# The gates themselves are defined in one place — scripts/verify.mjs and
# scripts/boot-smoke.mjs / scripts/a11y-audit.mjs — so CI and local runs can
# never drift apart. See docs/ENGINEERING-STANDARDS.md §2 and §6.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # `check:assertions` compares the branch against its base, so
                  # it needs the history a shallow clone omits. Without this the
                  # gate reports "no base revision is reachable" and skips —
                  # a notice, not a pass, but a gate that never runs in CI is
                  # not doing its job.
                  fetch-depth: 0

            # Node 24: required for native TypeScript type stripping, which the
            # migration relies on to run test/*.ts directly with no build step.
            # Node 20 cannot do this.
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The boot-smoke and a11y gates drive the real game in a real browser, so
            # CI needs one. --with-deps pulls the OS libraries Chromium links against.
            - name: Install Chromium for the browser gates
              run: npx playwright install --with-deps chromium

            # Godot: the port's 12 suites, 309 assertions and the generated-data drift
            # check all run through it, and `.godot/` (the class_name cache) is
            # gitignored — so a fresh checkout needs one `--import` before any
            # `verify_*.gd` will load.
            #
            # UNTIL THIS STEP EXISTED, check:godot printed NOTICE and exited 0 on every
            # CI run: the whole Godot half of this repository was enforced only on
            # whichever contributor happened to have Godot installed. A tooling audit
            # proved it by setting CONFIG.VERSION to 9.9.9 and getting "all 23 gates
            # passed" under CI's PATH, while the same tree failed correctly on drift the
            # moment Godot was on PATH.
            #
            # PINNED. `godotAssertionFloors` are exact per-suite counts derived from one
            # particular Godot's output format, so an unpinned upgrade could change the
            # format rather than the behaviour and fail the gate for the wrong reason.
            - name: Install Godot
              run: |
                  set -euo pipefail
                  GODOT_VERSION=4.7.2
                  curl -fsSL -o /tmp/godot.zip \
                    "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
                  unzip -q /tmp/godot.zip -d /tmp/godot
                  sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
                  sudo chmod +x /usr/local/bin/godot
                  godot --version

            # Build the class_name cache the suites need, and prove the suites can load
            # before the gate that runs them. Without this the failure surfaces at gate 5
            # blaming a DOCUMENT -- `claims "godotAssertions" is 309, but the measurement
            # is 0` -- because the measurement runs them and they cannot parse.
            - name: Import the Godot project
              run: godot --headless --path godot --import

            # Tier 1 (no browser): lint, format, unit tests, date-hermeticity, test
            # baseline, suppression ceilings, hygiene.
            # Tier 2 (browser): boot smoke through the critical path, axe a11y scan
            # of every surface.
            # Both stop at the first failure.
            - name: Run the full verify gate
              run: npm run verify:all
